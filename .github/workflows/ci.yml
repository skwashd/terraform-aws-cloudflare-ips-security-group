name: "Validate Module"

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.11"
          terraform_wrapper: false

      - name: Run fmt
        run: terraform fmt -diff -check -no-color -recursive

      - name: Run init
        run: terraform init

      - name: Run validate
        run: terraform validate -no-color

      - name: Run test
        run: terraform test -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Init TFLint
        env:
          # Recent tflint verifies plugin release attestations by default, and
          # there is a known panic in that path when a token is present. Both
          # the aws and dave-says plugins are public releases.
          GITHUB_TOKEN: ""
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact

  provider-versions:
    name: Provider Version Matrix (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: [floors, ceilings, latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.11"
          terraform_wrapper: false

      # Floors leg pins the versions this module actually works on, not the
      # (unsatisfiable) >= 4.0.0 cloudflare floor still declared in
      # versions.tf -- that gets corrected in the 2.0.0 release. The
      # cloudflare floor here is 5.1.0, not the declared-range minimum of
      # 5.0.0: the cloudflare_ip_ranges data source this module depends on
      # was not added until 5.1.0.
      #
      # Ceiling versions go stale as new releases land within the declared
      # ranges (aws < 7.0.0, cloudflare < 6.0.0). Dependabot does not track
      # this file, so they need a periodic manual bump.
      #
      # The "latest" leg has no override: terraform init resolves whatever is
      # newest within versions.tf's declared ranges, same as a fresh install
      # with no committed lockfile. This is the leg that would have caught
      # the unsatisfiable cloudflare floor.
      - name: Pin provider versions (${{ matrix.leg }})
        if: matrix.leg != 'latest'
        run: |
          case "${{ matrix.leg }}" in
            floors)
              aws_version="5.0.0"
              cloudflare_version="5.1.0"
              ;;
            ceilings)
              aws_version="6.61.0"
              cloudflare_version="5.23.0"
              ;;
          esac
          cat > versions_override.tf <<TF
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "= ${aws_version}"
              }
              cloudflare = {
                source  = "cloudflare/cloudflare"
                version = "= ${cloudflare_version}"
              }
            }
          }
          TF

      - name: Run init
        run: terraform init

      - name: Run validate
        run: terraform validate -no-color

      - name: Run test
        run: terraform test -no-color
